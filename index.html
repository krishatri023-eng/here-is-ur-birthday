<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday ❤️</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
        color: white;
        text-align: center;
    }

    h1 {
        font-size: 3em;
        margin-top: 80px;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #fff; }
        to { text-shadow: 0 0 25px #ff4d6d; }
    }

    .message {
        font-size: 1.3em;
        margin: 20px auto;
        width: 70%;
        line-height: 1.6;
    }

    .cake {
        font-size: 80px;
        margin-top: 20px;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
    }

    .balloon {
        position: absolute;
        width: 40px;
        height: 50px;
        background: red;
        border-radius: 50%;
        animation: rise 10s infinite ease-in;
    }

    .balloon:after {
        content: "";
        position: absolute;
        width: 2px;
        height: 40px;
        background: white;
        top: 50px;
        left: 50%;
    }

    @keyframes rise {
        0% { bottom: -100px; opacity: 1; }
        100% { bottom: 110%; opacity: 0; }
    }

    .heart {
        color: #ff2e63;
        font-size: 30px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }
</style>
</head>

<body>

<h1>Happy Birthday My Love ❤️</h1>

<div class="cake">🎂</div>

<div class="message">
    Today is a special day because it gave me the most special person in my life.<br>
    You make my world brighter, happier, and more beautiful.<br><br>
    Wishing you endless happiness, love, and success.<br>
    I love you forever <span class="heart">❤</span>
</div>

<!-- Balloons -->
<div class="balloon" style="left:10%; background:#ff4d6d; animation-delay:0s;"></div>
<div class="balloon" style="left:30%; background:#6a5acd; animation-delay:2s;"></div>
<div class="balloon" style="left:50%; background:#ffa500; animation-delay:4s;"></div>
<div class="balloon" style="left:70%; background:#00c9a7; animation-delay:1s;"></div>
<div class="balloon" style="left:85%; background:#ff69b4; animation-delay:3s;"></div>

</body>
</html>
